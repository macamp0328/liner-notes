type: collection.insomnia.rest/5.0
schema_version: '5.1'
name: liner-notes API
meta:
  id: wrk_13111ce0eaa3a0125a71610c8a401394
  description: Graph-driven vinyl record collection explorer
collection:
  - name: ops
    meta:
      id: fld_8fc21bbd94ee5b742bc99f438d4095fb
      description: Health and admin operations
      sortKey: 0
    children:
      - name: Service and Neo4j health check
        meta:
          id: req_3f900c7cb936d2123b551ddbf63e8b89
          sortKey: 0
        url: '{{ _.base_url }}/api/v1/health'
        method: GET
      - name: Public graph + enrichment coverage stats
        meta:
          id: req_eead4e611ac7e1c0fc2deb5a7866cbbf
          sortKey: 100
        url: '{{ _.base_url }}/api/v1/stats'
        method: GET
  - name: admin
    meta:
      id: fld_e3b121477007669c3cbfaadd2400fd58
      description: Ingestion control and operational status
      sortKey: 100
    authentication:
      type: bearer
      token: '{{ _.admin_token }}'
    children:
      - name: ingest
        meta:
          id: fld_4e5a8dda0554ee825465f383992e6712
          sortKey: 0
        children:
          - name: Trigger the full Discogs → Neo4j ingestion pipeline
            meta:
              id: req_0324abc3e11687f6b40ed110f518e46f
              sortKey: 0
            url: '{{ _.base_url }}/api/v1/admin/ingest'
            method: POST
          - name: Get the status of the current or last ingestion job
            meta:
              id: req_ea6c594e5b79a79da7666242ad94fa52
              sortKey: 100
            url: '{{ _.base_url }}/api/v1/admin/ingest/status'
            method: GET
      - name: reset
        meta:
          id: fld_8f510d7c583c0b5a06d5b96bf06f2050
          sortKey: 100
        children:
          - name: Wipe the entire graph (destructive)
            meta:
              id: req_ac45da5be96bcf412181ce40fa941538
              sortKey: 0
            url: '{{ _.base_url }}/api/v1/admin/reset'
            method: POST
            parameters:
              - name: confirm
                value: wipe-all
                description: Must equal "wipe-all" to proceed.
                disabled: true
      - name: lyrics
        meta:
          id: fld_e53f1491bc56f597882a3cae1e542dea
          sortKey: 200
        children:
          - name: Clear all Genius-sourced lyrics for re-enrichment
            meta:
              id: req_badf1b066ce9a32478cfbc59ee3a42e5
              sortKey: 0
            url: '{{ _.base_url }}/api/v1/admin/lyrics/clear-genius'
            method: POST
          - name: Run lyrics enrichment standalone
            meta:
              id: req_54681241fa1512b6ed689a503c377ec5
              sortKey: 100
            url: '{{ _.base_url }}/api/v1/admin/lyrics/enrich'
            method: POST
          - name: Status of the most recent lyrics enrichment run
            meta:
              id: req_cf37808f220584de4176df6783f94d46
              sortKey: 200
            url: '{{ _.base_url }}/api/v1/admin/lyrics/status'
            method: GET
      - name: nationality
        meta:
          id: fld_031311e845021401a248a67585ea8407
          sortKey: 300
        children:
          - name: Enrich Artist and Musician nodes with nationality (ORIGIN_COUNTRY)
            meta:
              id: req_87057ecabc1dc8ed0a3d6e79ad781dc7
              sortKey: 0
            url: '{{ _.base_url }}/api/v1/admin/nationality/enrich'
            method: POST
          - name: Reset nationality enrichment markers for a full re-run
            meta:
              id: req_7d38cea4e9b194a4683194243c21724e
              sortKey: 100
            url: '{{ _.base_url }}/api/v1/admin/nationality/reset'
            method: POST
          - name: Status of the most recent nationality enrichment run
            meta:
              id: req_acf7c670eb2c577fb3e5811a5cd5d9b8
              sortKey: 200
            url: '{{ _.base_url }}/api/v1/admin/nationality/status'
            method: GET
      - name: master-data
        meta:
          id: fld_e60a251e4d389e140f31a4fe5d87d96f
          sortKey: 400
        children:
          - name: Enrich Master nodes with global pressing countries and formats
            meta:
              id: req_98f55d226ac19f92aee102050df61a81
              sortKey: 0
            url: '{{ _.base_url }}/api/v1/admin/master-data/enrich'
            method: POST
          - name: Status of the most recent master data enrichment run
            meta:
              id: req_b17588a6b177f588c5e7eab7ccca508e
              sortKey: 100
            url: '{{ _.base_url }}/api/v1/admin/master-data/status'
            method: GET
      - name: mb-release-events
        meta:
          id: fld_4ac0d49a82b5e01417d9ed78a21a8075
          sortKey: 500
        children:
          - name: Enrich Master nodes with MusicBrainz release events (MB_RELEASED_IN)
            meta:
              id: req_ae0f533bbd3e3dd8063a8f32ac576ce3
              sortKey: 0
            url: '{{ _.base_url }}/api/v1/admin/mb-release-events/enrich'
            method: POST
          - name: Reset MusicBrainz release event enrichment markers for a full re-run
            meta:
              id: req_283bcaabc7da5cb304635471d3a64420
              sortKey: 100
            url: '{{ _.base_url }}/api/v1/admin/mb-release-events/reset'
            method: POST
          - name: Status of the most recent MusicBrainz release events enrichment run
            meta:
              id: req_23691abcf8d0889384a70649e8372019
              sortKey: 200
            url: '{{ _.base_url }}/api/v1/admin/mb-release-events/status'
            method: GET
      - name: track-musicbrainz
        meta:
          id: fld_359e1aa6949715e6e1115475278578c4
          sortKey: 600
        children:
          - name: Enrich Track nodes with MusicBrainz recording MBID + ISRC
            meta:
              id: req_81aaf2229d779f3a45ce89d0e00e9cbf
              sortKey: 0
            url: '{{ _.base_url }}/api/v1/admin/track-musicbrainz/enrich'
            method: POST
          - name: Reset MusicBrainz track enrichment markers for a full re-run
            meta:
              id: req_590c51a50b9d66df7825c04ae27e0423
              sortKey: 100
            url: '{{ _.base_url }}/api/v1/admin/track-musicbrainz/reset'
            method: POST
          - name: Status of the most recent MusicBrainz track enrichment run
            meta:
              id: req_c42d1f57bae6859e0f1e291ffd7aa44a
              sortKey: 200
            url: '{{ _.base_url }}/api/v1/admin/track-musicbrainz/status'
            method: GET
      - name: track-acousticbrainz
        meta:
          id: fld_a5b20e870d6e814a58ab0606f4d340d0
          sortKey: 700
        children:
          - name: Enrich Track nodes with AcousticBrainz audio features
            meta:
              id: req_98b9c99bc4d59218b7bc294eae9926d4
              sortKey: 0
            url: '{{ _.base_url }}/api/v1/admin/track-acousticbrainz/enrich'
            method: POST
          - name: Reset AcousticBrainz track enrichment markers for a full re-run
            meta:
              id: req_900c509a1de4256fe1d92a7ea9689ff4
              sortKey: 100
            url: '{{ _.base_url }}/api/v1/admin/track-acousticbrainz/reset'
            method: POST
          - name: Status of the most recent AcousticBrainz track enrichment run
            meta:
              id: req_817192f9987aea7ef9b8e01435b0e3c2
              sortKey: 200
            url: '{{ _.base_url }}/api/v1/admin/track-acousticbrainz/status'
            method: GET
      - name: track-deezer
        meta:
          id: fld_2489505638a9fa3e5441b173bc2ec21b
          sortKey: 800
        children:
          - name: Enrich Track nodes with Deezer BPM and loudness
            meta:
              id: req_b555ef4ef084fd7a72364782d7a5eb30
              sortKey: 0
            url: '{{ _.base_url }}/api/v1/admin/track-deezer/enrich'
            method: POST
          - name: Reset Deezer track enrichment markers for a full re-run
            meta:
              id: req_2f145ccaad37c59074892630eff493a2
              sortKey: 100
            url: '{{ _.base_url }}/api/v1/admin/track-deezer/reset'
            method: POST
          - name: Status of the most recent Deezer track enrichment run
            meta:
              id: req_3d89a3dd8557fc9989694ae3d77e245e
              sortKey: 200
            url: '{{ _.base_url }}/api/v1/admin/track-deezer/status'
            method: GET
      - name: artist-profiles
        meta:
          id: fld_7e77f2af1e01d2375a512e63c6a10f76
          sortKey: 900
        children:
          - name: Enrich Artist nodes with realName and profile from the Discogs artist API
            meta:
              id: req_3c1490d29077c5f755c69c4ba11ceb7c
              sortKey: 0
            url: '{{ _.base_url }}/api/v1/admin/artist-profiles/enrich'
            method: POST
          - name: Reset artist profile enrichment markers for a full re-run
            meta:
              id: req_f29351770d006b9bc5776b042f0286ed
              sortKey: 100
            url: '{{ _.base_url }}/api/v1/admin/artist-profiles/reset'
            method: POST
          - name: Status of the most recent artist profiles enrichment run
            meta:
              id: req_75e09cb99671d91c8814304d80e3221a
              sortKey: 200
            url: '{{ _.base_url }}/api/v1/admin/artist-profiles/status'
            method: GET
      - name: artist-genres
        meta:
          id: fld_5515ef67fb5cd51c3edfd967d155a77d
          sortKey: 1000
        children:
          - name: Aggregate genres and styles from releases onto Artist nodes
            meta:
              id: req_73bc3de62f2b3069397936d3c8eaa94b
              sortKey: 0
            url: '{{ _.base_url }}/api/v1/admin/artist-genres/enrich'
            method: POST
          - name: Status of the most recent artist genres enrichment run
            meta:
              id: req_da35925df528d6cf8e45e1879856a6cc
              sortKey: 100
            url: '{{ _.base_url }}/api/v1/admin/artist-genres/status'
            method: GET
      - name: group-members
        meta:
          id: fld_8aab557e9325a1e70388e072e9945260
          sortKey: 1100
        children:
          - name: Link group members via MEMBER_OF from the Discogs artist API
            meta:
              id: req_96860b84510b9b7aa7bf749fec81eaf2
              sortKey: 0
            url: '{{ _.base_url }}/api/v1/admin/group-members/enrich'
            method: POST
          - name: Delete all MEMBER_OF edges and reset group-members markers for a full re-run
            meta:
              id: req_732cdda590558cf5f99d2f9f5d2a058f
              sortKey: 100
            url: '{{ _.base_url }}/api/v1/admin/group-members/reset'
            method: POST
          - name: Status of the most recent group members enrichment run
            meta:
              id: req_666dc51649e4851eb6c52a7a797289df
              sortKey: 200
            url: '{{ _.base_url }}/api/v1/admin/group-members/status'
            method: GET
      - name: person-reconciliation
        meta:
          id: fld_03d54ba059816940e23ed9da3cc552e4
          sortKey: 1200
        children:
          - name: Reconcile Musician identities with Artist nodes (SAME_PERSON_AS)
            meta:
              id: req_17f47cbd13294993ba8274ae7e8f775d
              sortKey: 0
            url: '{{ _.base_url }}/api/v1/admin/person-reconciliation/enrich'
            method: POST
          - name: Status of the most recent person reconciliation run
            meta:
              id: req_ab62714d6cf9868554823175f518b4aa
              sortKey: 100
            url: '{{ _.base_url }}/api/v1/admin/person-reconciliation/status'
            method: GET
      - name: reload
        meta:
          id: fld_5808d8d0499fb9db11f9d9870b1ff194
          sortKey: 1300
        children:
          - name: Trigger the orchestrated reload (ingest + every enrichment) with resume
            meta:
              id: req_f73458a6893ff768359f1c0c72013f5e
              sortKey: 0
            url: '{{ _.base_url }}/api/v1/admin/reload'
            method: POST
          - name: Per-stage status of the most recent orchestrated reload
            meta:
              id: req_fa4547ace0b2dd20f0305a54cbf33e1e
              sortKey: 100
            url: '{{ _.base_url }}/api/v1/admin/reload/status'
            method: GET
  - name: collection
    meta:
      id: fld_0df53349a0079405a0f0f1fa85863bcb
      description: Release, artist, and label queries
      sortKey: 200
    children:
      - name: Paginated list of all releases in the collection
        meta:
          id: req_c42f33c9ef2defb06b843490548b97d4
          sortKey: 0
        url: '{{ _.base_url }}/api/v1/releases'
        method: GET
        parameters:
          - name: page
            value: '1'
            disabled: true
          - name: limit
            value: '20'
            disabled: true
      - name: Single release with all related nodes hydrated
        meta:
          id: req_e4531a274d669545edea12b7922d33e0
          sortKey: 100
        url: '{{ _.base_url }}/api/v1/releases/:discogsId'
        method: GET
        pathParameters:
          - name: discogsId
            value: '249504'
      - name: Artist with connected releases and credits
        meta:
          id: req_500901de91ec56f4dd93e94378cabcf3
          sortKey: 200
        url: '{{ _.base_url }}/api/v1/artists/:discogsId'
        method: GET
        pathParameters:
          - name: discogsId
            value: '249504'
      - name: Label with all releases
        meta:
          id: req_179221bf930ce0fbce9800d270c46831
          sortKey: 300
        url: '{{ _.base_url }}/api/v1/labels/:discogsId'
        method: GET
        pathParameters:
          - name: discogsId
            value: '249504'
  - name: explore
    meta:
      id: fld_99ff5c92b9012d6020e4a06e1de4d500
      description: Relationship traversal endpoints
      sortKey: 300
    children:
      - name: Releases featuring this musician, with instrument and role on each result
        meta:
          id: req_7bfe6ac742d1e571b2886bdcb7ec380d
          sortKey: 0
        url: '{{ _.base_url }}/api/v1/explore/musician/:name'
        method: GET
        pathParameters:
          - name: name
            value: Steve Gadd
      - name: Releases this person is credited on as a producer
        meta:
          id: req_d0d3ff2ac9c01f3ff4a2928086827b1f
          sortKey: 100
        url: '{{ _.base_url }}/api/v1/explore/producer/:name'
        method: GET
        pathParameters:
          - name: name
            value: Quincy Jones
      - name: Releases this person is credited on as an engineer
        meta:
          id: req_4c84a6dca8af527ed3e3ab9943ce2553
          sortKey: 200
        url: '{{ _.base_url }}/api/v1/explore/engineer/:name'
        method: GET
        pathParameters:
          - name: name
            value: Bob Clearmountain
      - name: Releases recorded at this studio
        meta:
          id: req_b0a9d044bf7e18f240d423ca462f0188
          sortKey: 300
        url: '{{ _.base_url }}/api/v1/explore/studio/:name'
        method: GET
        pathParameters:
          - name: name
            value: Abbey Road Studios
      - name: Releases on this label
        meta:
          id: req_2a90c46248fd11d9ba25bcccd928b767
          sortKey: 400
        url: '{{ _.base_url }}/api/v1/explore/label/:name'
        method: GET
        pathParameters:
          - name: name
            value: Blue Note
      - name: Releases in this genre
        meta:
          id: req_a7dbd4bd9edbf82e9fae43fb6e6744ce
          sortKey: 500
        url: '{{ _.base_url }}/api/v1/explore/genre/:name'
        method: GET
        pathParameters:
          - name: name
            value: Jazz
      - name: Releases in this style
        meta:
          id: req_8d65cc5ae2ae4ec5dad3d75b888ebe93
          sortKey: 600
        url: '{{ _.base_url }}/api/v1/explore/style/:name'
        method: GET
        pathParameters:
          - name: name
            value: Hard Bop
      - name: Releases from this country
        meta:
          id: req_5b12ee7287324e0a922493aa2a388c26
          sortKey: 700
        url: '{{ _.base_url }}/api/v1/explore/country/:name'
        method: GET
        pathParameters:
          - name: name
            value: US
      - name: Releases from this decade — accepts 1970s format
        meta:
          id: req_183fb1c1e68ba589c49007b17eacad69
          sortKey: 800
        url: '{{ _.base_url }}/api/v1/explore/decade/:decade'
        method: GET
        pathParameters:
          - name: decade
            value: '1970'
      - name: Releases from this exact year
        meta:
          id: req_aa30336c726783f229b1f5217cb4cb87
          sortKey: 900
        url: '{{ _.base_url }}/api/v1/explore/year/:year'
        method: GET
        pathParameters:
          - name: year
            value: '1977'
      - name: Graph traversal from a release — returns nodes reachable within depth hops (max 3)
        meta:
          id: req_29e7edcf6984d82dd0c777ab5095cd25
          sortKey: 1000
        url: '{{ _.base_url }}/api/v1/explore/connections/:discogsId'
        method: GET
        parameters:
          - name: depth
            value: '2'
            disabled: true
        pathParameters:
          - name: discogsId
            value: '249504'
      - name: Release pairs that share one or more session musicians
        meta:
          id: req_80287ce4b9c1d41e34e0e03d6f38dae7
          sortKey: 1100
        url: '{{ _.base_url }}/api/v1/explore/shared-musicians'
        method: GET
      - name: Tracks with the most distinct countries of origin among their credited musicians. Requires nationality enrichment to have been run.
        meta:
          id: req_780d18450bf98dc564e75aaa926a3850
          sortKey: 1200
        url: '{{ _.base_url }}/api/v1/explore/tracks/most-international'
        method: GET
        parameters:
          - name: limit
            value: '10'
            disabled: true
      - name: Albums in this collection with the widest global pressing reach. Requires master data enrichment to have been run.
        meta:
          id: req_ecd44bf255eb79f5ef72d9cc205be97b
          sortKey: 1300
        url: '{{ _.base_url }}/api/v1/explore/releases/most-pressed'
        method: GET
        parameters:
          - name: limit
            value: '10'
            disabled: true
      - name: Find tracks by audio features
        meta:
          id: req_08162dc68e9b3133701494d2eef98130
          sortKey: 1400
        url: '{{ _.base_url }}/api/v1/explore/tracks/by-audio-features'
        method: GET
        parameters:
          - name: minTempo
            value: '90'
            disabled: true
          - name: maxTempo
            value: '140'
            disabled: true
          - name: key
            value: C
            description: Tonic, e.g. "C" or "A#"
            disabled: true
          - name: scale
            value: major
            description: Musical scale
            disabled: true
          - name: voiceInstrumental
            value: voice
            description: AcousticBrainz voice/instrumental classifier result
            disabled: true
          - name: minDanceability
            value: '0.5'
            description: Minimum danceability probability (0–1)
            disabled: true
          - name: limit
            value: '20'
            disabled: true
  - name: search
    meta:
      id: fld_fe015351f267a86c32c17af689dadf30
      description: Full-text search
      sortKey: 400
    children:
      - name: Full-text search across releases, artists, and tracks — ranked by relevance
        meta:
          id: req_7cc96fd06b0334fb65e8b5802ee1399d
          sortKey: 0
        url: '{{ _.base_url }}/api/v1/search'
        method: GET
        parameters:
          - name: q
            value: blue
      - name: Full-text search within track lyrics — returns tracks with release context
        meta:
          id: req_da44c2415f99cedae9a0f45dc5097153
          sortKey: 100
        url: '{{ _.base_url }}/api/v1/search/lyrics'
        method: GET
        parameters:
          - name: q
            value: love
environments:
  name: Base Environment
  meta:
    id: env_5fd08987c41ec0e296a0380b870fe9a1
  data:
    base_url: http://localhost:3000
    admin_token: ''
  subEnvironments:
    - name: Local
      meta:
        id: env_60a3b478d4bd7a29d34a3d58facf919e
      data:
        base_url: http://localhost:3000
    - name: Production
      meta:
        id: env_1e81727b11606ca574e83cfe18940fb1
      data:
        base_url: https://ln-api.impressivelyadequate.com
