name: Diagrams

# Regenerate architecture diagrams under infra/diagrams/ and FAIL the PR
# if the committed diagrams don't match what the generator produces.
# Triggers when:
#   - a .tf file changes (resource graph or per-file diagrams stale)
#   - request-flow.mmd changes (hand-maintained logical flow updated)
#   - this workflow or the generator script changes
#
# Why fail-on-drift instead of auto-commit:
#   GitHub's anti-recursion rule does not trigger downstream workflows on
#   pushes made with the default GITHUB_TOKEN. The previous auto-commit
#   design landed a `chore(diagrams): regenerate ...` commit on the PR
#   branch after CI ran on the prior SHA, leaving the actual PR HEAD with
#   zero checks and branch protection blocking the merge. Fixing it would
#   require a PAT or GitHub App token — extra moving parts for one repo.
#   Failing the check instead pushes regeneration to the contributor's
#   workstation, which is one command (`pnpm diagrams:generate`).
#
# Local equivalent (Mac): `brew install inframap`, ensure Docker Desktop is
# running, then `pnpm diagrams:generate`. CI installs inframap from source
# (the v0.8.1 release ships no binaries) and renders SVG via a pinned
# Docker image (nshine/dot:2.40.1) so the output is byte-identical to local Mac.

on:
  # PRs to any base branch (stacked PRs included), not just main.
  pull_request:
    paths:
      - 'infra/terraform/**'
      - 'infra/diagrams/request-flow.mmd'
      - 'scripts/diagrams/**'
      - '.github/workflows/diagrams.yml'

# Least-privilege default for the GITHUB_TOKEN (CodeQL actions/missing-workflow-permissions).
# The single job only reads the checkout and compares regenerated artifacts (fail-on-drift);
# it never pushes, so read-only is sufficient.
permissions:
  contents: read

jobs:
  regenerate:
    name: Regenerate diagrams
    runs-on: ubuntu-latest
    # Backstop against wedged installs/pulls — GitHub default is 360 min.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.23'

      - name: Install inframap from source
        # The v0.8.1 release has no binary assets attached — go install is the
        # most reliable path. Pin to a tag to keep CI reproducible.
        run: go install github.com/cycloidio/inframap@v0.8.1

      - name: Pre-pull pinned graphviz image
        # The script renders SVG via a pinned Docker image (nshine/dot:2.40.1)
        # so Mac and CI produce byte-identical SVG. Docker is pre-installed on
        # ubuntu-latest; the pull is cached automatically by the daemon.
        run: docker pull nshine/dot:2.40.1@sha256:17ba91db2197ae4154cdc4b397a263017ce15c7f2c0cb8bf29404d78bcb4bd6d

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate diagrams
        run: pnpm diagrams:generate

      - name: Fail if diagrams are out of date
        # Any drift between the committed diagram artifacts and what the
        # generator produces means the contributor forgot to run
        # `pnpm diagrams:generate` locally before pushing. Print the diff so
        # the failure is self-explanatory, then exit non-zero.
        #
        # `git status --porcelain`, not `git diff --quiet`: diff only sees
        # changes to TRACKED files, so a brand-new generated artifact (e.g. the
        # per-file .mmd for a freshly added .tf) would pass the check while
        # missing from the commit. status catches untracked files too.
        run: |
          if [ -n "$(git status --porcelain -- infra/diagrams README.md infra/RUNBOOK.md)" ]; then
            echo "::error::Diagrams are out of date. Run 'pnpm diagrams:generate' locally and commit the result."
            echo "Drift:"
            git status --porcelain -- infra/diagrams README.md infra/RUNBOOK.md
            git --no-pager diff -- infra/diagrams README.md infra/RUNBOOK.md | head -200
            exit 1
          fi
