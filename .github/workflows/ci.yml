name: CI

# Runs on every PR against main and on every push to main.
# All jobs must pass before a PR is mergeable (branch protection enforces this — see CLAUDE.md).
#
# Job dependency graph (arrows = "requires passing first"):
#
#   format, lint, typecheck                                       ┐
#   tests-and-coverage (unit + integration, Neo4j, 70% threshold) │  all start at
#   schema-validation (Neo4j container, started via composite action) │  t=0, in
#   script-tests (changelog unit tests), terraform (fmt + validate) │  parallel
#   hadolint (Dockerfile lint), kubeconform (k8s manifest validate)  │
#   audit, secrets-scan, codeql, actionlint (+ standalone shellcheck) ┘
#
#   lint, typecheck ──→ docker-build   (the ONLY gate: the multi-stage build
#                                       compiles TS so it waits on typecheck —
#                                       but NOT on the ~90s test job, so it runs
#                                       alongside it instead of behind it)
#
# Everything fans out at t=0 to minimise wall-clock; the test job (~85s) and
# CodeQL (~80s) are the floor. There is deliberately NO static fast-fail gate on
# the test/schema jobs — on a green PR (the case you wait on) it only added ~22s
# of latency. The trade: Neo4j/Docker runner minutes are spent even when
# lint/typecheck fails. For agents: a red lint/type check no longer skips the
# test jobs, so you may see several reds at once — fix the static checks first.
#
# Why unit + integration tests are combined in one job:
#   The 70% coverage threshold applies to the full test suite. Unit tests alone only
#   reach ~57% because route handlers and the ingestion pipeline are only exercised via
#   Fastify inject() and a live Neo4j instance. Combining them means one Neo4j startup
#   instead of two, and coverage is measured against the complete test run.

on:
  # Run the full CI suite on every PR regardless of base branch, so stacked PRs
  # (feature → feature) get the same gate as PRs into main — no need to wait for
  # the merge into main to get CI feedback. `push` stays main-only: branch
  # commits are already covered by their PR's pull_request run.
  pull_request:
  push:
    branches: [main]

# Least-privilege default for the GITHUB_TOKEN (CodeQL actions/missing-workflow-permissions).
# Every job here only reads the checkout; none write to the repo, comment on PRs, or need
# packages/id-token. Set once at the workflow level so all jobs inherit read-only access.
# The codeql job overrides this with its own block (it needs security-events: write to upload
# SARIF) — a job-level permissions block fully replaces, not merges with, this default.
permissions:
  contents: read

# Rapid agent push cadence means a PR head is often superseded within seconds —
# cancel the obsolete run instead of letting the full 13-job fan-out finish for
# nothing. Pushes to main never cancel (each merged commit keeps its CI record).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Static checks ────────────────────────────────────────────────────────────
  # These three jobs run in parallel and gate everything downstream.
  # Fix all three before expecting tests to run.

  format:
    name: Format Check
    # Prettier must report zero diffs. Fix locally: pnpm prettier --write .
    runs-on: ubuntu-latest
    # Backstop against wedged installs/pulls — GitHub default is 360 min.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm prettier --check .

  lint:
    name: Lint
    # ESLint with eslint-plugin-security. Zero warnings or errors allowed.
    # Fix locally: pnpm lint (most issues auto-fixable with --fix).
    runs-on: ubuntu-latest
    # Backstop against wedged installs/pulls — GitHub default is 360 min.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint

  typecheck:
    name: Type Check
    # TypeScript strict mode. Covers both tsconfig.json (src/) and tsconfig.test.json (tests/).
    # Fix locally: pnpm typecheck
    # Note: NodeNext resolution requires .js extensions on local relative imports.
    runs-on: ubuntu-latest
    # Backstop against wedged installs/pulls — GitHub default is 360 min.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check (src + tests)
        run: pnpm typecheck

  # ── Tests ────────────────────────────────────────────────────────────────────
  # These run with NO `needs:` — they start at t=0, in parallel with the static
  # checks, rather than waiting ~22s behind them. The old static gate was a
  # runner-minute saver (don't spin up Neo4j for code that already has lint/type
  # errors), but on a green PR — the case you actually sit waiting on — it just
  # added the full static-check duration to the critical path. We trade those
  # minutes for wall-clock. CodeQL (~80s) is now the floor; the test job lands
  # just under it instead of starting only after the gate clears.

  tests-and-coverage:
    name: Tests & Coverage
    # Two-phase test run, both against the live neo4j:5.26 service container:
    #
    # Phase 1 — driver-free suite (tests/unit + tests/route) with coverage enforcement.
    #   Route handlers are exercised via Fastify inject() with a mocked DB (tests/route/).
    #   Thresholds: 70% lines/functions/branches/statements (vitest.config.ts).
    #   Fix locally: pnpm --filter graph-service test:coverage
    #
    # Phase 2 — real-Neo4j integration suite (tests/integration/) via vitest.integration.config.ts.
    #   Connects to the service container via NEO4J_TEST_*, applies the real schema, seeds the
    #   graph with fixture data, and exercises the full route→repository→Cypher→Neo4j stack.
    #   Fix locally: start docker-compose Neo4j, then pnpm --filter graph-service test:integration
    #
    # Note: the neo4j:5.26 image is Community edition — only the single default "neo4j" database
    # exists. CREATE DATABASE is not supported. Test isolation is by full graph wipe between files.
    #
    # Neo4j is started by the ./.github/actions/start-neo4j composite action instead of a
    # `services:` block: the runner pulls `services:` images with a fixed, untunable retry that
    # intermittently fails on a Docker Hub blip; the action pulls neo4j:5.26 with our own
    # retry/backoff and then waits on Docker's healthcheck. Connection is bolt://localhost:7687,
    # unchanged.
    runs-on: ubuntu-latest
    # Backstop against wedged installs/pulls — GitHub default is 360 min.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Start Neo4j (pull with retry, then wait for healthy)
        uses: ./.github/actions/start-neo4j
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run driver-free tests with coverage (70% threshold)
        run: pnpm --filter graph-service test:coverage
      - name: Run real-Neo4j integration tests
        env:
          NEO4J_TEST_URI: bolt://localhost:7687
          NEO4J_TEST_USER: neo4j
          NEO4J_TEST_PASSWORD: test-password
        run: pnpm --filter graph-service test:integration

  schema-validation:
    name: Schema Validation
    # Runs services/graph-service/scripts/validate-schema.ts against a live Neo4j instance.
    # Verifies that all constraints and indexes (src/db/schema.ts) apply idempotently —
    # the script runs schema setup twice and asserts no error on either run.
    # Fix locally: start Neo4j via docker-compose, then pnpm tsx services/graph-service/scripts/validate-schema.ts
    # No `needs:` — runs in parallel from t=0 (same trade as tests-and-coverage above).
    # Neo4j is started by ./.github/actions/start-neo4j (pull-with-retry; see that job's note).
    runs-on: ubuntu-latest
    # Backstop against wedged installs/pulls — GitHub default is 360 min.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Start Neo4j (pull with retry, then wait for healthy)
        uses: ./.github/actions/start-neo4j
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate Neo4j schema (idempotency check)
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: test-password
        run: pnpm tsx services/graph-service/scripts/validate-schema.ts

  docker-build:
    name: Docker Build
    # Builds the multi-stage graph-service image (does NOT push to ECR — that's deploy.yml).
    # Build context is the repo root (Dockerfile copies the workspace lockfile).
    # GitHub Actions cache (type=gha) stores BuildKit layers between runs.
    # Gated on lint+typecheck but NOT tests-and-coverage, so it runs alongside the
    # ~90s test job instead of waiting behind it (~28s shaved off the serial path).
    # The image is never pushed (push: false) and never reaches ECR from here, so
    # building it on a red-test PR wastes only a runner — nothing ships. typecheck
    # stays a gate because the multi-stage build compiles TS: a type error would
    # fail the build anyway, so there's no point starting it before typecheck.
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    # Backstop against wedged installs/pulls — GitHub default is 360 min.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4
      - name: Build graph-service image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: ./services/graph-service/Dockerfile
          push: false
          tags: liner-notes/graph-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Security ─────────────────────────────────────────────────────────────────
  # These jobs run unconditionally in parallel — they're independent of source correctness.

  audit:
    name: Security Audit
    # pnpm audit blocks on high AND critical CVEs (--audit-level=high is stricter than critical).
    # New CVEs in existing dependencies will surface here even with no code changes.
    # If this fails: check `pnpm audit` output, update the affected package, and re-push.
    runs-on: ubuntu-latest
    # Backstop against wedged installs/pulls — GitHub default is 360 min.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        run: pnpm audit --audit-level=high

  secrets-scan:
    name: Secrets Scan
    # TruffleHog scans every commit in the PR for accidentally committed credentials.
    # fetch-depth: 0 is required — TruffleHog diffs git history and needs the full log.
    # On PRs: scans from the default branch tip to HEAD (only new commits).
    # On pushes to main: scans from before the push to HEAD.
    # Latent edge: `github.event.before` is the all-zeros SHA on the FIRST push to a brand-new
    # branch — safe today only because the push trigger is main-only (a first push to main can't
    # happen). If branch-push triggers are ever added, the zero-SHA breaks this base; switch to
    # `github.event.pull_request.base.sha` (PRs) or guard the zero-SHA explicitly before doing so.
    # If this fails: the credential is in git history — rotate it immediately, then
    # use `git filter-branch` or BFG to scrub the history before re-pushing.
    runs-on: ubuntu-latest
    # Backstop against wedged installs/pulls — GitHub default is 360 min.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@d411fff7b8879a62509f3fa98c07f247ac089a51 # v3.95.5
        with:
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.repository.default_branch || github.event.before }}
          head: HEAD

  codeql:
    name: CodeQL Security Scan
    # Static security analysis using GitHub CodeQL (security-extended query suite).
    # Results appear in the repo's Security → Code scanning tab as SARIF alerts.
    # Scans both javascript-typescript (the service code) and actions (the workflow
    # files themselves — e.g. missing GITHUB_TOKEN permissions). The repo's GitHub
    # default CodeQL setup is disabled, so this workflow is the *only* code scanner;
    # without `actions` here, workflow files would have no CodeQL coverage at all.
    # wait-for-processing: false avoids a conflict with GitHub's default CodeQL setup
    # (now disabled) where both upload SARIF and the async rejection blocks CI.
    runs-on: ubuntu-latest
    # Backstop against wedged installs/pulls — GitHub default is 360 min.
    timeout-minutes: 15
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript,actions
          queries: security-extended
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          wait-for-processing: false

  actionlint:
    name: Actionlint
    # Lints .github/workflows/*.yml: expression syntax, context availability, action
    # input schemas, and shellcheck over every `run:` block. Catches errors a plain
    # YAML parse can't — e.g. using the `runner` context in a job-level `env:`, which
    # GitHub rejects at validation time and which startup-failed deploy.yml on the
    # merge to main (#213, fixed in #214). Independent of source correctness, so it
    # runs in parallel with no `needs:` — same group as audit/secrets-scan/codeql.
    # Fix locally: `brew install actionlint shellcheck` (or download the pinned
    # binaries), then run `actionlint` from the repo root.
    runs-on: ubuntu-latest
    # Backstop against wedged installs/pulls — GitHub default is 360 min.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Run actionlint
        # Pin BOTH actionlint and shellcheck for reproducibility — same convention
        # as the trufflehog/inframap/graphviz pins. actionlint shellchecks every
        # `run:` block using whatever shellcheck is on PATH, and the runner image's
        # shellcheck version drifts (older versions flag info-level nits newer ones
        # dropped), so an unpinned shellcheck makes this gate non-deterministic.
        # Bump the *_VERSION envs to update.
        env:
          ACTIONLINT_VERSION: 1.7.12
          # From the release's actionlint_1.7.12_checksums.txt (linux_amd64).
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          SHELLCHECK_VERSION: 0.11.0
          # SHA256 of the official GitHub release asset (shellcheck ships no
          # checksums file); recompute and update this when bumping the version.
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          # Each binary is downloaded over HTTPS and verified against a pinned
          # SHA256 before it's extracted or run — a tampered/unexpected asset
          # fails the checksum and the job stops. Same integrity-pinning intent
          # as the sha256-digest-pinned graphviz image in diagrams.yml.

          # Pinned shellcheck → /usr/local/bin, which precedes the image's
          # /usr/bin on PATH, so actionlint discovers this version.
          curl -fsSL -o /tmp/shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  /tmp/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          sudo install -m 0755 "/tmp/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

          # Pinned actionlint.
          curl -fsSL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint

          # No path args: actionlint auto-discovers every workflow under .github/workflows/.
          /tmp/actionlint

      - name: Shellcheck standalone scripts
        # actionlint shellchecks `run:` blocks inside workflows, but never the
        # standalone *.sh files in the repo. Reuse the pinned shellcheck installed
        # above (on /usr/local/bin) to lint the admin HTTP/ops helpers, the
        # prepare-time hook installer, and the agent bash-guard hook — all
        # safety-critical (the bash-guard is the only enforcement against
        # `--no-verify` / `git push --force`; prepare.sh installs the husky walls),
        # so a silent break in any of them matters.
        run: shellcheck scripts/admin/*.sh scripts/prepare.sh .claude/hooks/bash-guard.sh

  script-tests:
    name: Script Tests
    # Runs the standalone scripts/ unit tests via node:test/tsx. No Neo4j, no
    # secrets, fully offline — so it joins the t=0 fan-out with the static checks.
    # Covers the changelog generator (scripts/changelog/*.test.ts) — the
    # render/parse logic the per-merge, on-deploy, and weekly-reconcile changelog
    # workflows depend on — and the prepare-time husky-install guard
    # (scripts/prepare.test.ts). Both were previously local-only and never gated.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run changelog script tests
        run: pnpm changelog:test
      - name: Run prepare guard tests
        run: pnpm prepare:test

  terraform:
    name: Terraform Validate
    # Static validation of the Terraform config: `fmt -check` (style) + `validate`
    # (syntax, references, required-provider wiring) for BOTH roots. `init
    # -backend=false` downloads the providers without touching the remote S3 state
    # or needing AWS creds; `validate` evaluates config structure only (no plan, no
    # variable values, no API calls). Runs unconditionally (no path filter) like
    # the rest of ci.yml so it stays a required-eligible gate — unlike the
    # path-filtered, advisory diagrams/insomnia drift guards. terraform 1.15.3
    # matches .mise.toml; terraform_wrapper:false keeps fmt/validate exit codes clean.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.3
          terraform_wrapper: false
      - name: Format check (recursive)
        # Fix locally: terraform fmt -recursive infra/terraform
        run: terraform fmt -check -recursive infra/terraform
      - name: Validate root module
        run: |
          terraform -chdir=infra/terraform init -backend=false
          terraform -chdir=infra/terraform validate
      - name: Validate bootstrap module
        run: |
          terraform -chdir=infra/terraform/bootstrap init -backend=false
          terraform -chdir=infra/terraform/bootstrap validate

  hadolint:
    name: Hadolint
    # Lints services/graph-service/Dockerfile (structure, pinned versions, layer
    # ordering, shell pitfalls). docker-build COMPILES the image but never lints it,
    # so a regression like an unpinned base tag or a missing-WORKDIR COPY would ship
    # silently. Runs unconditionally (no path filter) like the rest of ci.yml so it
    # stays a required-eligible gate — same group as actionlint/terraform.
    #
    # Pin the binary + SHA256 like the actionlint/shellcheck install: download over
    # HTTPS, verify the checksum BEFORE running, so a tampered/unexpected asset fails
    # the gate. Bump HADOLINT_VERSION + HADOLINT_SHA256 (from the release's
    # hadolint-linux-x86_64.sha256) to update.
    runs-on: ubuntu-latest
    # Backstop against wedged installs/pulls — GitHub default is 360 min.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Run hadolint
        env:
          HADOLINT_VERSION: 2.14.0
          # From the release asset hadolint-linux-x86_64.sha256.
          HADOLINT_SHA256: 6bf226944684f56c84dd014e8b979d27425c0148f61b3bd99bcc6f39e9dc5a47
        run: |
          curl -fsSL -o /tmp/hadolint \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          echo "${HADOLINT_SHA256}  /tmp/hadolint" | sha256sum -c -
          chmod +x /tmp/hadolint
          /tmp/hadolint --version
          /tmp/hadolint services/graph-service/Dockerfile

  kubeconform:
    name: Kubeconform
    # Statically validates the k8s manifests under infra/k8s/** against the upstream
    # JSON schemas — catches a bad apiVersion / missing required field / typo'd kind
    # that today only surfaces at `kubectl apply` against the live cluster. Runs
    # unconditionally (no path filter) so it stays a required-eligible gate.
    #
    # -strict rejects unknown fields (catches typos). We -skip ONLY the two
    # External-Secrets CRD kinds (ClusterSecretStore/ExternalSecret) by name rather
    # than -ignore-missing-schemas: the latter skips ANY (kind, apiVersion) without a
    # schema, so a typo'd apiVersion (apps/v9) or kind (Deploymnet) would be silently
    # SKIPPED instead of failing — the exact regression this gate exists to catch.
    # With an explicit -skip, every other resource still REQUIRES a schema; -summary
    # prints the skipped count so the CRD gap stays visible. Default (master) schemas,
    # NOT -kubernetes-version: every kind here is a stable GA apiVersion (apps/v1, v1,
    # batch/v1, rbac.../v1), so a pinned cluster version would only risk a 404.
    #
    # Pin kustomize + kubeconform binaries + SHA256 (actionlint-style). Bump the
    # *_VERSION + *_SHA256 envs (kustomize checksums.txt / kubeconform CHECKSUMS).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned kustomize + kubeconform
        env:
          KUSTOMIZE_VERSION: 5.8.1
          KUSTOMIZE_SHA256: 029a7f0f4e1932c52a0476cf02a0fd855c0bb85694b82c338fc648dcb53a819d
          KUBECONFORM_VERSION: 0.8.0
          KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
        run: |
          # kustomize (the release tag URL-encodes the slash in kustomize/vX.Y.Z).
          curl -fsSL -o /tmp/kustomize.tar.gz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          echo "${KUSTOMIZE_SHA256}  /tmp/kustomize.tar.gz" | sha256sum -c -
          tar -xzf /tmp/kustomize.tar.gz -C /tmp kustomize
          sudo install -m 0755 /tmp/kustomize /usr/local/bin/kustomize
          kustomize version

          # kubeconform.
          curl -fsSL -o /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  /tmp/kubeconform.tar.gz" | sha256sum -c -
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          sudo install -m 0755 /tmp/kubeconform /usr/local/bin/kubeconform
      - name: Validate graph-service stack (kustomize-built)
        # Build to a FILE, not a pipe: a kustomize-build failure surfaces directly
        # instead of being masked by kubeconform reading empty stdin. The build also
        # validates kustomization.yaml parses and applies the namespace + image
        # overlays, so what's checked matches what's deployed.
        run: |
          kustomize build infra/k8s/graph-service > /tmp/graph-service.yaml
          kubeconform -strict -skip ClusterSecretStore,ExternalSecret -summary /tmp/graph-service.yaml
      - name: Validate standalone manifests
        # namespace.yaml + the out-of-band deployer identity aren't part of any
        # kustomization. infra/k8s/aws-for-fluent-bit/values.yaml is a Helm values
        # file, NOT a manifest — deliberately excluded (kubeconform would reject it).
        run: |
          kubeconform -strict -skip ClusterSecretStore,ExternalSecret -summary \
            infra/k8s/namespace.yaml \
            infra/k8s/deploy/github-deployer.yaml
