name: Changelog release

# Cut a PUBLISHED, tagged CalVer release from everything currently Unreleased: sweep
# every Unreleased record into one `vYYYY.MM.DD` GitHub Release whose note richness
# ramps with the importance tier (see scripts/changelog/release.ts), then stamp those
# records and record the version in the versions.json asset on the rolling draft.
#
# Triggered two ways:
#  - AUTO, on every SUCCESSFUL Deploy (`workflow_run`). A deploy is gated by the
#    `production` environment's manual approval, so "Deploy succeeded" already means
#    "a human allowed this release to ship" — the cut tags the DEPLOYED commit
#    (`workflow_run.head_sha`) and sweeps everything merged since the last version.
#    Because main is linear, that is exactly "what is now in production."
#  - MANUAL, via "Run workflow" (`workflow_dispatch`) — a fallback to cut on demand
#    (optionally pinning `head_sha`). Locally: `pnpm changelog:release`
#    (or `HEAD_SHA=$(git rev-parse HEAD) pnpm changelog:release` to pin a commit).
#
# A cut with nothing pending is a no-op (no empty release), so a deploy that ships no
# new PRs since the last cut produces nothing.
#
# Why this is safe and loop-free: the cut creates a `refs/tags/*` ref, and every
# workflow's `on: push` filters `branches: [main]` (no `tags:` trigger anywhere), so a
# tag push cannot retrigger Deploy / CI / Changelog. Editing/creating a release makes
# no commit, so this never touches protected main. The shared `changelog` concurrency
# group serialises the cut against the per-merge updater and the reconciler.
#
# Gotchas:
#  - `workflow_run` only fires for the copy of THIS file on the default branch, so the
#    auto-trigger takes effect after merge to main (the PR that adds it can't self-fire).
#  - One-time, before the first cut on a fresh repo, run `pnpm changelog:baseline`.

on:
  workflow_run:
    workflows: ['Deploy'] # must equal deploy.yml `name:`
    types: [completed]
  workflow_dispatch:
    inputs:
      head_sha:
        description: 'Commit to tag the release at (the deployed commit). Default: current main HEAD.'
        required: false
        type: string

# contents:write → gh release create/edit/upload + the tag ref; pull-requests:read → gh pr view.
permissions:
  contents: write
  pull-requests: read

# Shared with changelog.yml / changelog-reconcile.yml so the read-modify-write of
# the store never races a per-merge update or a reconcile.
concurrency:
  group: changelog
  cancel-in-progress: false

jobs:
  release:
    name: Cut changelog version
    runs-on: ubuntu-latest
    # On the auto path, only cut after a SUCCESSFUL deploy OF MAIN. The head_branch
    # gate matters because deploy.yml also has `workflow_dispatch: {}`, which the
    # Actions UI can run on any ref — without it, a Deploy dispatched on a feature
    # branch would cut a release tagged at an un-merged commit and prematurely stamp
    # the backlog. A manual dispatch of THIS workflow has no workflow_run context, so
    # the first clause always lets it run.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cut the version release
        # HEAD_SHA is the tag's git target. Auto path → the deployed commit
        # (workflow_run.head_sha); manual path → the optional input; empty → release.ts
        # falls back to current main HEAD. Passed as DATA, never checked out as code.
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || inputs.head_sha }}
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: pnpm changelog:release
