name: Changelog release

# Cut a PUBLISHED, tagged CalVer release from everything currently Unreleased — a
# DELIBERATE, batched action you run when you've shipped a batch of merged PRs and
# want to declare them released. Sweeps every Unreleased record into one
# `vYYYY.MM.DD` GitHub Release whose note richness ramps with the importance tier
# (see scripts/changelog/release.ts), then stamps those records and records the
# version in the versions.json asset on the rolling draft.
#
# Run it from the Actions tab ("Run workflow"), or locally:
#   HEAD_SHA=$(git rev-parse HEAD) pnpm changelog:release   # pin an explicit commit
#   pnpm changelog:release                                  # default: current main HEAD
#
# This used to fire automatically on every successful Deploy (workflow_run). That
# tied "cut a release" to "a deploy happened" and swept the WHOLE backlog on any
# green deploy — including PRs that never deployed (docs/scripts) and PRs you were
# deliberately batching. Cutting is now an explicit dispatch so merged PRs
# accumulate in the Unreleased draft until you decide to release them.
#
# Why this is safe and loop-free: it creates a `refs/tags/*` ref, and every
# workflow's `on: push` filters `branches: [main]` (no `tags:` trigger anywhere),
# so a tag push cannot retrigger Deploy / CI / Changelog. Editing/creating a
# release makes no commit, so this never touches protected main.
#
# Gotchas:
#  - `workflow_dispatch` runs THIS file from the DEFAULT branch — it only takes
#    effect after merge to main; the PR that adds it cannot be dispatched yet.
#    Validate first with: DRY_RUN=1 pnpm changelog:release
#  - One-time, after merge, run `pnpm changelog:baseline` once before the first cut.

on:
  workflow_dispatch:
    inputs:
      head_sha:
        description: 'Commit to tag the release at (the deployed commit). Default: current main HEAD.'
        required: false
        type: string

# contents:write → gh release create/edit/upload + the tag ref; pull-requests:read → gh pr view.
permissions:
  contents: write
  pull-requests: read

# Shared with changelog.yml / changelog-reconcile.yml so the read-modify-write of
# the store never races a per-merge update or a reconcile.
concurrency:
  group: changelog
  cancel-in-progress: false

jobs:
  release:
    name: Cut changelog version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cut the version release
        # HEAD_SHA is the tag's git target. Empty (the default) → release.ts falls
        # back to current main HEAD. Passed as DATA, never checked out as code.
        env:
          HEAD_SHA: ${{ inputs.head_sha }}
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: pnpm changelog:release
