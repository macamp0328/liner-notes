name: Deploy

# Continuous deployment for graph-service (issue #120).
#
# On a merge to main that touches the service or its k8s manifests, this builds
# and pushes the image to ECR, then rolls it out to the private single-node k3s
# cluster reached over an AWS SSM port-forward — there is no public path to the
# API server (:6443 is firewalled; SSM is the only way in).
#
# Auth has two scoped identities, neither a long-lived key:
#   - AWS: GitHub OIDC assumes the `liner-notes-github-deploy` role (infra/terraform/cicd.tf).
#           The role can only push to ECR + open the one SSM port-forward.
#   - k8s: a scoped `github-deployer` ServiceAccount token (infra/k8s/deploy/github-deployer.yaml),
#           supplied as the base64 KUBECONFIG_B64 secret — never the cluster-admin kubeconfig.
#
# The `environment: production` job gate is the manual-approval wall: the role's
# trust policy only mints the `:environment:production` sub claim after a human
# approves, so the deploy is unassumable until then.
#
# One-time operator setup (GitHub environment, repo variables, KUBECONFIG_B64
# secret) is documented in the "CD — workflow setup" section of infra/RUNBOOK.md.

on:
  push:
    branches: [main]
    paths:
      - 'services/graph-service/**'
      # Committed docs artifacts (openapi.json, insomnia collection, schema diagrams)
      # are build/runtime-irrelevant — the Dockerfile never COPYs docs/. A docs-only
      # change (e.g. a schema-diagram refresh PR) must not trigger a prod redeploy of
      # an unchanged image. The '!' negation must follow the broad positive above; the
      # later positives don't overlap docs/**, so it only carves out the docs subtree. (#410)
      - '!services/graph-service/docs/**'
      - 'infra/k8s/**'
      - '.github/workflows/deploy.yml'
      # Root-level build inputs the Dockerfile COPYs — without these a
      # lockfile-only change (e.g. a Dependabot transitive security bump)
      # would merge to main but never deploy the rebuilt image.
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
  # Manual re-deploy of the current main from the Actions UI — same approval gate.
  # Use this to retry after a pre-flight failure (power the node on, then re-run).
  workflow_dispatch: {}

# Serialize deploys; never cancel one mid-apply — a queued run waits its turn.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write # assume the deploy role via OIDC
  contents: read # checkout

jobs:
  deploy:
    name: Deploy graph-service
    runs-on: ubuntu-latest
    # Manual-approval gate. Also mints the OIDC sub claim the role trust requires.
    environment: production
    timeout-minutes: 20
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          # The SSM session id is prefixed with this, so the deploy role's
          # `session/${aws:userid}-*`-scoped TerminateSession authorizes teardown.
          role-session-name: github-deploy
          aws-region: ${{ vars.AWS_REGION }}

      # Read the EC2 instance id + ECR repo URL straight from Terraform state
      # instead of point-in-time GitHub Actions variable snapshots that silently
      # go stale (#270). The deploy role has GetObject on exactly this one state
      # object (cicd.tf). The account-id-suffixed bucket name is derived at
      # runtime so no account id is committed. AWS_REGION stays a var — it's
      # needed to configure the very credentials that authorize this read.
      - name: Derive deploy targets from Terraform state
        env:
          PROJECT_NAME: ${{ vars.PROJECT_NAME || 'liner-notes' }}
        run: |
          set -euo pipefail
          acct=$(aws sts get-caller-identity --query Account --output text)
          # Pipe the state straight into jq and keep ONLY `.outputs`. The rest of
          # the document holds resource attributes (incl. secrets); never let the
          # full state land in a shell variable where a future debug `echo` could
          # leak it into the build log. pipefail catches an s3-cp/jq failure here.
          outputs=$(aws s3 cp "s3://${PROJECT_NAME}-tfstate-${acct}/graph-service/terraform.tfstate" - | jq -c '.outputs')
          for pair in "EC2_INSTANCE_ID=ec2_instance_id" "ECR_REPOSITORY_URL=ecr_repository_url"; do
            name=${pair%%=*}
            out=${pair#*=}
            val=$(jq -r --arg k "$out" '.[$k].value // empty' <<<"$outputs")
            if [ -z "$val" ]; then
              echo "::error::Terraform output '${out}' is empty or missing in state." >&2
              exit 1
            fi
            echo "${name}=${val}" >> "$GITHUB_ENV"
            echo "${name} <- ${out}"
          done

      # session-manager-plugin (for `aws ssm start-session`) and standalone
      # kustomize (kubectl's built-in cannot do `edit set image`) are NOT on the
      # runner; kubectl is but drifts. Pin all three from their official sources.
      - name: Install pinned deploy tooling
        env:
          SMP_VERSION: 1.2.707.0
          KUBECTL_VERSION: v1.36.1
          KUSTOMIZE_VERSION: v5.4.3
        run: |
          set -euo pipefail

          curl -fsSL -o /tmp/session-manager-plugin.deb \
            "https://s3.amazonaws.com/session-manager-downloads/plugin/${SMP_VERSION}/ubuntu_64bit/session-manager-plugin.deb"
          sudo dpkg -i /tmp/session-manager-plugin.deb
          session-manager-plugin --version

          curl -fsSL -o /tmp/kubectl \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          kubectl version --client

          curl -fsSL -o /tmp/kustomize.tar.gz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/kustomize.tar.gz -C /tmp
          sudo install -m 0755 /tmp/kustomize /usr/local/bin/kustomize
          kustomize version

      # Fail fast before the build if the node is asleep (scale-to-zero) — there
      # is no point building an image we can't roll out.
      # EC2_INSTANCE_ID comes from the "Derive deploy targets" step above (it's
      # exported to $GITHUB_ENV, so it's already in this shell's environment).
      - name: Pre-flight — node running and SSM-reachable
        run: |
          set -euo pipefail

          state=$(aws ec2 describe-instances \
            --instance-ids "$EC2_INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].State.Name' --output text)
          echo "Instance state: $state"
          if [ "$state" != "running" ]; then
            echo "::error::k3s node $EC2_INSTANCE_ID is '$state', not 'running'. Power it on (pnpm power:on) and re-run." >&2
            exit 1
          fi

          ping=$(aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=$EC2_INSTANCE_ID" \
            --query 'InstanceInformationList[0].PingStatus' --output text)
          echo "SSM PingStatus: $ping"
          if [ "$ping" != "Online" ]; then
            echo "::error::SSM agent on $EC2_INSTANCE_ID is '$ping', not 'Online'. Wait for it to register, then re-run." >&2
            exit 1
          fi

      - name: Compute image tag (short SHA)
        id: meta
        run: echo "tag=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build and push graph-service image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./services/graph-service/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ env.ECR_REPOSITORY_URL }}:${{ steps.meta.outputs.tag }}
          # Reuse the warm main-branch buildx cache ci.yml's docker-build writes.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write kubeconfig from secret
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          set -euo pipefail
          umask 077
          # Set KUBECONFIG here (not in job-level env) — the `runner` context is
          # unavailable at jobs.<id>.env and using it there fails workflow
          # validation. Export for this step + persist for later steps.
          export KUBECONFIG="$RUNNER_TEMP/deploy-kubeconfig"
          echo "KUBECONFIG=$KUBECONFIG" >> "$GITHUB_ENV"
          printf '%s' "$KUBECONFIG_B64" | base64 -d > "$KUBECONFIG"
          # Mask the decoded bearer token so it can never surface in later logs.
          token=$(kubectl config view --raw -o jsonpath='{.users[0].user.token}')
          [ -n "$token" ] && echo "::add-mask::$token"
          echo "Context: $(kubectl config current-context)"

      # The manifests pin AWS_REGION/ECR host to us-east-1; retarget if deployed
      # elsewhere. Mirrors RUNBOOK Step 7a. Ephemeral runner — never committed.
      - name: Retarget region in manifests (non-us-east-1 only)
        run: |
          set -euo pipefail
          if [ "$AWS_REGION" != "us-east-1" ]; then
            sed -i.bak "s/us-east-1/$AWS_REGION/g" \
              infra/k8s/graph-service/external-secret.yaml \
              infra/k8s/graph-service/ecr-pull-secret-refresher.yaml
          fi

      # EC2_INSTANCE_ID is in the shell env from the "Derive deploy targets" step.
      - name: Open SSM port-forward to the k3s API
        run: |
          set -euo pipefail
          aws ssm start-session \
            --target "$EC2_INSTANCE_ID" \
            --document-name AWS-StartPortForwardingSession \
            --parameters '{"portNumber":["6443"],"localPortNumber":["6443"]}' \
            > "$RUNNER_TEMP/ssm.log" 2>&1 &
          echo "SSM_PID=$!" >> "$GITHUB_ENV"

          # Poll until the tunnel carries TLS. /livez answers 200, or 401 before
          # auth — either means the tunnel is up (curl without -f ignores status).
          for i in $(seq 1 30); do
            if curl -sk --max-time 5 -o /dev/null https://127.0.0.1:6443/livez; then
              echo "Tunnel up after attempt ${i}."
              sid=$(grep -oE 'SessionId: [A-Za-z0-9._-]+' "$RUNNER_TEMP/ssm.log" | head -1 | awk '{print $2}')
              echo "SSM_SID=${sid}" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 2
          done
          echo "::error::SSM port-forward to 127.0.0.1:6443 never became reachable." >&2
          cat "$RUNNER_TEMP/ssm.log" >&2 || true
          exit 1

      - name: Deploy — set image and apply manifests
        env:
          IMAGE: ${{ env.ECR_REPOSITORY_URL }}:${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          cd infra/k8s/graph-service
          kustomize edit set image "graph-service-image=${IMAGE}"
          kubectl apply -k .

      # `kubectl rollout undo` reverts ONLY the Deployment's pod-template revision.
      # The preceding `kubectl apply -k .` may also have (re)applied
      # external-secret.yaml, ecr-pull-secret-refresher.yaml, and service.yaml; if
      # one of THOSE is what broke the rollout, this undo does not revert it — the
      # previous commit's kustomization would have to be re-applied by hand. The
      # branches below report the undo outcome distinctly (`if … then` doesn't trip
      # `set -e`) so a failed rollback is visible in the job summary instead of
      # being indistinguishable from a clean one — both ended in `|| true` before.
      - name: Roll out (undo on failure)
        run: |
          set -euo pipefail
          if kubectl -n liner-notes rollout status deployment/graph-service --timeout=180s; then
            echo "Rollout succeeded."
          else
            echo "::error::Rollout failed — rolling back the Deployment to its previous revision." >&2
            echo "::warning::Rollback reverts only the Deployment. Any service.yaml / external-secret.yaml / ecr-pull-secret-refresher.yaml changes in this apply are NOT reverted." >&2
            if kubectl -n liner-notes rollout undo deployment/graph-service; then
              if kubectl -n liner-notes rollout status deployment/graph-service --timeout=120s; then
                echo "Rollback succeeded — Deployment is back on its previous revision."
              else
                echo "::error::Rollback was issued but the previous revision did not become healthy within 120s — manual intervention required." >&2
              fi
            else
              # `rollout undo` also fails on the first-ever deploy (no prior revision).
              echo "::error::Rollback failed (undo errored, or this was the first deploy with no prior revision) — cluster left on the failed revision; manual intervention required." >&2
            fi
            exit 1
          fi

      # Asserts the rolled-out pod answers 200 via an in-cluster port-forward over
      # the SSM tunnel that's already open — not a public URL. The public path is
      # verified continuously by the Route 53 health check (infra/terraform/
      # observability.tf), so the deploy gate can't false-fail on a public-edge
      # issue the rollout never touched (the #270 incident: HTTP 000 against a
      # stale/locked SERVICE_URL while the rollout had already succeeded). Runs
      # after `rollout status`, so a Ready pod exists. A 503 means the pod is up
      # but Neo4j/Aura is unreachable — a real failure, but not one a rollback
      # fixes, so we fail the job without undoing.
      - name: Health gate — assert /api/v1/health on the rolled-out pod
        run: |
          set -euo pipefail
          kubectl -n liner-notes port-forward deployment/graph-service 18080:3000 \
            > "$RUNNER_TEMP/pf.log" 2>&1 &
          pf_pid=$!
          echo "PF_PID=$pf_pid" >> "$GITHUB_ENV"

          # Wait for the tunnel, but fail fast (dumping pf.log) if port-forward
          # exits immediately — missing pods/portforward RBAC, no matching pod,
          # etc. Backgrounding means such a failure wouldn't trip `set -e`, so
          # without this the step would burn the whole retry budget on HTTP 000
          # and report a misleading "service unhealthy".
          for _ in $(seq 1 10); do
            if ! kill -0 "$pf_pid" 2>/dev/null; then
              echo "::error::kubectl port-forward exited before the tunnel came up (see log below)." >&2
              cat "$RUNNER_TEMP/pf.log" >&2 || true
              exit 1
            fi
            grep -q "Forwarding from" "$RUNNER_TEMP/pf.log" && break
            sleep 1
          done

          url="http://127.0.0.1:18080/api/v1/health"
          for i in $(seq 1 20); do
            # On a connection failure curl already prints `000` via `-w`; `|| true`
            # just stops its non-zero exit from tripping `set -e` (do NOT drop it —
            # without it the loop dies on the first miss; `|| echo 000` would
            # instead double-print to `000000`).
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$url" || true)
            echo "Attempt ${i}: HTTP ${code}"
            if [ "$code" = "200" ]; then
              echo "Service is healthy."
              exit 0
            fi
            if [ "$code" = "503" ]; then
              echo "::error::/api/v1/health returned 503 — pod up but Neo4j/Aura unreachable." >&2
              exit 1
            fi
            sleep 6
          done
          echo "::error::/api/v1/health did not return 200 within the retry budget (last: ${code})." >&2
          cat "$RUNNER_TEMP/pf.log" >&2 || true
          exit 1

      # Always release the tunnel. terminate-session by id frees one of the two
      # allowed concurrent SSM sessions so a re-run isn't blocked. Prefer the id
      # captured at open time; fall back to re-parsing the session log if it
      # wasn't (output races / format change), and warn rather than silently
      # skip if it still can't be resolved — the killed local process already
      # drops the tunnel, and the server-side session then idles out on its own.
      - name: Tear down SSM port-forward
        if: always()
        run: |
          # Health-gate kubectl port-forward (rides on the SSM tunnel) first.
          [ -n "${PF_PID:-}" ] && kill "$PF_PID" 2>/dev/null || true
          [ -n "${SSM_PID:-}" ] && kill "$SSM_PID" 2>/dev/null || true
          sid="${SSM_SID:-}"
          if [ -z "$sid" ] && [ -f "$RUNNER_TEMP/ssm.log" ]; then
            sid=$(grep -oE 'SessionId: [A-Za-z0-9._-]+' "$RUNNER_TEMP/ssm.log" | head -1 | awk '{print $2}' || true)
          fi
          if [ -n "$sid" ]; then
            aws ssm terminate-session --session-id "$sid" 2>/dev/null || true
          else
            echo "::warning::SSM SessionId unresolved — terminate-session skipped. The killed local process drops the tunnel; the server-side session idles out on its own."
          fi
          true
