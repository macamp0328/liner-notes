name: Start Neo4j
description: >-
  Start a neo4j:5.26 container for the test / schema-validation jobs. Unlike a `services:`
  block — whose image the runner pulls in its built-in "Initialize containers" step with a
  fixed, short retry that can't be tuned — this pulls neo4j:5.26 with our own retry/backoff, so an
  intermittent Docker Hub blip (the `registry-1.docker.io` connection timeouts that have
  failed "Initialize containers") gets retried instead of failing the whole job. Readiness
  reuses Docker's own healthcheck (the same probe the `services:` block used), after which the
  job connects on bolt://localhost:7687 exactly as before.

runs:
  using: composite
  steps:
    - name: Pull neo4j:5.26 (retry on Docker Hub flakiness)
      shell: bash
      run: |
        for attempt in 1 2 3 4 5; do
          if docker pull neo4j:5.26; then
            echo "pulled neo4j:5.26 (attempt $attempt)"
            exit 0
          fi
          echo "::warning title=neo4j pull retry::docker pull neo4j:5.26 failed (attempt $attempt/5) — retrying"
          sleep $((attempt * 15))
        done
        echo "::error title=neo4j pull failed::docker pull neo4j:5.26 failed after 5 attempts"
        exit 1

    - name: Start Neo4j
      shell: bash
      run: |
        docker run -d --name neo4j \
          -p 7687:7687 -p 7474:7474 \
          -e NEO4J_AUTH=neo4j/test-password \
          --health-cmd "wget -q --spider http://localhost:7474 || exit 1" \
          --health-interval 3s \
          --health-timeout 5s \
          --health-retries 20 \
          --health-start-period 5s \
          neo4j:5.26

    - name: Wait for Neo4j to be healthy
      shell: bash
      run: |
        for i in $(seq 1 40); do
          status="$(docker inspect --format '{{.State.Health.Status}}' neo4j 2>/dev/null || echo missing)"
          if [ "$status" = "healthy" ]; then
            echo "neo4j healthy after ~$((i * 3))s"
            exit 0
          fi
          sleep 3
        done
        echo "::error title=neo4j not ready::neo4j did not become healthy within ~120s"
        docker logs neo4j || true
        exit 1
