services:
  neo4j:
    image: neo4j:5.26
    ports:
      - '127.0.0.1:7474:7474' # Neo4j Browser — localhost only
      - '127.0.0.1:7687:7687' # Bolt — localhost only
    environment:
      NEO4J_AUTH: none
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: 'apoc.*'
      NEO4J_dbms_security_procedures_allowlist: 'apoc.*'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:7474']
      interval: 10s
      timeout: 5s
      retries: 10

  graph-service:
    build:
      context: .
      dockerfile: services/graph-service/Dockerfile
    ports:
      # Loopback-only, same rationale as the neo4j ports above — .env.local carries a
      # real ADMIN_TOKEN, so don't expose the dev server to the LAN.
      - '127.0.0.1:3000:3000'
    env_file:
      - .env.local
    environment:
      NODE_ENV: development
      NEO4J_URI: bolt://neo4j:7687
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
