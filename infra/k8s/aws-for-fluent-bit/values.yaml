# Helm values for eks/aws-for-fluent-bit on the k3s node.
#
# Issue: https://github.com/macamp0328/liner-notes/issues/117
# Chart: eks/aws-for-fluent-bit v0.2.0 (app v3.2.1)
#
# Applied by RUNBOOK.md "Observability — fluent-bit and alarms" Step 10:
#   curl -fsSL <raw-url-of-this-file> > /tmp/fluent-bit-values.yaml
#   helm upgrade --install aws-for-fluent-bit eks/aws-for-fluent-bit \
#     --namespace amazon-cloudwatch --create-namespace \
#     -f /tmp/fluent-bit-values.yaml --wait --timeout 5m
#
# Two streams flow into the CloudWatch Log Group /liner-notes/graph-service:
#   - pod stdout/stderr  — via the chart's default tail input on /var/log/containers/*.log
#   - k3s systemd journal — via the additionalInputs block below, which the
#     pod-restarts metric filter (observability.tf) matches against for
#     "Liveness probe failed" / "Back-off restarting failed container".

cloudWatchLogs:
  enabled: true
  region: us-east-1
  logGroupName: /liner-notes/graph-service
  logStreamPrefix: pod.
  autoCreateGroup: false # terraform owns the log group

# volumes / volumeMounts are full-override keys in this chart (no
# extraVolumes / extraVolumeMounts append-style alternative exists in
# v0.2.0). Re-declare the two chart defaults alongside the two new hostPath
# mounts the systemd input needs:
#   - /run/log/journal       — AL2023 stores the journal in this volatile dir
#                              under /run/log/journal/<machine-id>/
#   - /etc/machine-id        — required so journald can match the journal namespace
volumes:
  - name: varlog
    hostPath:
      path: /var/log
  - name: varlibdockercontainers
    hostPath:
      path: /var/lib/docker/containers
  - name: runlogjournal
    hostPath:
      path: /run/log/journal
  - name: etcmachineid
    hostPath:
      path: /etc/machine-id
      type: File

volumeMounts:
  - name: varlog
    mountPath: /var/log
  - name: varlibdockercontainers
    mountPath: /var/lib/docker/containers
    readOnly: true
  - name: runlogjournal
    mountPath: /run/log/journal
    readOnly: true
  - name: etcmachineid
    mountPath: /etc/machine-id
    readOnly: true

# additionalInputs is appended raw into the fluent-bit ConfigMap. The chart's
# `input.systemd.*` value path is silently a no-op in v0.2.0 — confirmed by
# `helm show values eks/aws-for-fluent-bit | grep systemd` returning nothing.
# Raw fluent-bit input config is the only working hook.
additionalInputs: |
  [INPUT]
      Name             systemd
      Tag              k3s.*
      Path             /run/log/journal
      Systemd_Filter   _SYSTEMD_UNIT=k3s.service
      Read_From_Tail   On
