# Helm values for eks/aws-for-fluent-bit on the k3s node.
#
# Issue: https://github.com/macamp0328/liner-notes/issues/117
# Chart: eks/aws-for-fluent-bit v0.2.0 (app v3.2.1) — pin via `--version 0.2.0`
#
# Applied by RUNBOOK.md "Observability — fluent-bit and alarms" Step 10. The
# runbook resolves `cloudWatchLogs.region` dynamically from IMDS and passes
# it via `--set`, so the value below is only a fallback. `logGroupName` is
# static — if you've overridden `var.project_name` in terraform, override
# here too:
#   helm upgrade ... --set cloudWatchLogs.logGroupName=/<your-project>/graph-service
# With `autoCreateGroup: false`, a mismatch silently drops every log line.
#
# Two streams flow into the CloudWatch Log Group /liner-notes/graph-service:
#   - pod stdout/stderr  — via the chart's default tail input on /var/log/containers/*.log.
#                          The default tail picks up every pod on the node, so an
#                          `additionalFilters` grep block below narrows it to the
#                          graph-service pod only (see issue #152). Surviving records
#                          arrive in CloudWatch as `pod.kube.var.log.containers.graph-service-*`
#                          streams. The `pod.` prefix comes from the output's
#                          `logStreamPrefix`, not the internal fluent-bit tag (which
#                          is `kube.*`).
#   - k3s systemd journal — via the additionalInputs block below; arrives as
#                          `pod.k3s.k3s.service`. The pod-restarts metric filter
#                          (observability.tf) matches "Liveness probe failed" /
#                          "CrashLoopBackOff" against this stream's content, so the
#                          grep filter is scoped to `Match kube.*` and never touches
#                          the systemd stream.

cloudWatchLogs:
  enabled: true
  region: us-east-1 # overridden via --set from IMDS in RUNBOOK Step 10
  logGroupName: /liner-notes/graph-service # must match var.project_name (see header)
  logStreamPrefix: pod.
  autoCreateGroup: false # terraform owns the log group

# volumes / volumeMounts are full-override keys in this chart (no
# extraVolumes / extraVolumeMounts append-style alternative exists in
# v0.2.0). Re-declare the two chart defaults alongside the /etc/machine-id
# bind needed by the systemd input:
#   - /var/log               — chart default; also surfaces /var/log/journal
#                              transitively, since AL2023 stores the journal
#                              persistently at /var/log/journal/<machine-id>/
#                              (the volatile /run/log/journal/ stays empty).
#   - /etc/machine-id        — required so the systemd input can match the
#                              journal namespace inside the container.
volumes:
  - name: varlog
    hostPath:
      path: /var/log
  - name: varlibdockercontainers
    hostPath:
      path: /var/lib/docker/containers
  - name: etcmachineid
    hostPath:
      path: /etc/machine-id
      type: File

volumeMounts:
  - name: varlog
    mountPath: /var/log
  - name: varlibdockercontainers
    mountPath: /var/lib/docker/containers
    readOnly: true
  - name: etcmachineid
    mountPath: /etc/machine-id
    readOnly: true

# additionalInputs is appended raw into the fluent-bit ConfigMap. The chart's
# `input.systemd.*` value path is silently a no-op in v0.2.0 — confirmed by
# `helm show values eks/aws-for-fluent-bit | grep systemd` returning nothing.
# Raw fluent-bit input config is the only working hook.
#
# Path points at /var/log/journal — verified with `journalctl --header`
# returning `File path: /var/log/journal/<machine-id>/system.journal`.
# A previous revision of this file used /run/log/journal (the volatile
# location) which AL2023 leaves empty when persistent storage is enabled —
# the systemd input started cleanly but produced zero records.
additionalInputs: |
  [INPUT]
      Name             systemd
      Tag              k3s.*
      Path             /var/log/journal
      Systemd_Filter   _SYSTEMD_UNIT=k3s.service
      Read_From_Tail   On

# additionalFilters is appended raw into the fluent-bit ConfigMap (same
# pattern as additionalInputs above) AFTER the chart's built-in kubernetes
# enrichment filter, so the `kubernetes.labels.*` record fields are
# populated by the time grep runs.
#
# Without this filter the default tail input on /var/log/containers/*.log
# ships logs from EVERY pod on the node (aws-for-fluent-bit itself,
# external-secrets, k3s system pods, etc.) into the
# /liner-notes/graph-service log group — inflating CloudWatch ingestion
# cost (issue #148 billing alarm) and polluting every metric filter in
# infra/terraform/observability.tf, all of which match against this single
# log group (e.g. `error_log_lines` would match fluent-bit's own [error]
# lines as graph-service errors).
#
# `Match kube.*` scopes the filter to the kubernetes tail stream only.
# The systemd journal input above (Tag k3s.*) is untouched — the
# pod_restarts metric filter (observability.tf:64) depends on it. Note the
# `pod.` prefix that appears on CloudWatch log stream names comes from
# `cloudWatchLogs.logStreamPrefix` (the output stage), not the internal
# fluent-bit tag, so `pod.kube.*` would never match here.
additionalFilters: |
  [FILTER]
      Name   grep
      Match  kube.*
      Regex  $kubernetes['labels']['app.kubernetes.io/name'] ^graph-service$
