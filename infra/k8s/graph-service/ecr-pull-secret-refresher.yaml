# Keeps the ECR image-pull secret fresh.
#
# Plain k3s/containerd does NOT consult the EC2 instance role when pulling
# private ECR images, so we mint a 12h ECR auth token via the AWS SDK (which
# DOES use IMDS / the instance role from inside a pod), and project it into a
# `kubernetes.io/dockerconfigjson` secret that the graph-service Deployment
# references via `imagePullSecrets`. The CronJob re-runs every 6h so the
# secret is always valid by the time containerd next pulls.
#
# The initial secret must be bootstrapped manually before the first deploy —
# see infra/RUNBOOK.md "Bootstrap the ECR pull secret".

apiVersion: v1
kind: ServiceAccount
metadata:
  name: ecr-pull-secret-refresher
  namespace: liner-notes
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ecr-pull-secret-refresher
  namespace: liner-notes
rules:
  - apiGroups: ['']
    resources: ['secrets']
    verbs: ['get', 'create', 'update', 'patch']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ecr-pull-secret-refresher
  namespace: liner-notes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ecr-pull-secret-refresher
subjects:
  - kind: ServiceAccount
    name: ecr-pull-secret-refresher
    namespace: liner-notes
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ecr-pull-secret-refresher
  namespace: liner-notes
spec:
  # ECR tokens are valid 12h; refresh at 6h to leave plenty of headroom.
  schedule: '0 */6 * * *'
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        spec:
          serviceAccountName: ecr-pull-secret-refresher
          restartPolicy: OnFailure
          containers:
            - name: refresh
              # Public image (Amazon ECR Public) — no ECR pull auth needed
              # for the refresher itself. Installs kubectl inline because the
              # base image doesn't ship one.
              image: public.ecr.aws/aws-cli/aws-cli:2.17.0
              env:
                - name: AWS_REGION
                  value: us-east-1 # must match var.aws_region
                - name: ECR_REGISTRY
                  # <account-id>.dkr.ecr.<region>.amazonaws.com — set in the
                  # runbook via `kubectl -n liner-notes set env cronjob/ecr-pull-secret-refresher ECR_REGISTRY=...`.
                  value: REPLACE_ME
                - name: KUBECTL_VERSION
                  value: v1.30.5
              command: ['/bin/bash', '-c']
              args:
                - |
                  set -euo pipefail

                  # Pull a pinned kubectl from the official Kubernetes mirror.
                  curl -fsSL -o /usr/local/bin/kubectl \
                    "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
                  chmod +x /usr/local/bin/kubectl

                  TOKEN=$(aws ecr get-login-password --region "$AWS_REGION")
                  AUTH=$(printf 'AWS:%s' "$TOKEN" | base64 -w0)
                  DOCKERCONFIG=$(printf '{"auths":{"%s":{"auth":"%s"}}}' "$ECR_REGISTRY" "$AUTH" | base64 -w0)

                  cat <<EOF | kubectl apply -f -
                  apiVersion: v1
                  kind: Secret
                  metadata:
                    name: ecr-pull-secret
                    namespace: liner-notes
                  type: kubernetes.io/dockerconfigjson
                  data:
                    .dockerconfigjson: $DOCKERCONFIG
                  EOF
              # Tiny job — runs for ~10s every 6h. Cap usage so it can't
              # squeeze graph-service on the shared t3.micro.
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
