apiVersion: v1
kind: Service
metadata:
  name: graph-service
  namespace: liner-notes
  labels:
    app.kubernetes.io/name: graph-service
    app.kubernetes.io/part-of: liner-notes
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: graph-service
  ports:
    - name: http
      port: 80
      targetPort: http
      # EC2 security group (allow_app_cidr in Terraform) opens this port on the node.
      nodePort: 30080
