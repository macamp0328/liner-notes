apiVersion: v1
kind: Service
metadata:
  name: graph-service
  namespace: liner-notes
  labels:
    app.kubernetes.io/name: graph-service
    app.kubernetes.io/part-of: liner-notes
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: graph-service
  ports:
    - name: http
      port: 80
      targetPort: http
      # EC2 security group opens this port on the node — to Cloudflare's IP ranges
      # when restrict_app_to_cloudflare is set (#119), otherwise per allow_app_cidr.
      nodePort: 30080
