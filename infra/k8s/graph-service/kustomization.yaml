apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: liner-notes

resources:
  - external-secret.yaml
  - ecr-pull-secret-refresher.yaml
  - deployment.yaml
  - service.yaml

# Image override — the deployment.yaml ships with a placeholder so the
# manifest is valid on its own; operators retarget it without editing YAML:
#
#   cd infra/k8s/graph-service
#   kustomize edit set image graph-service-image=<ECR_URL>:<TAG>
#   kubectl apply -k .
#
# The CD pipeline runs the same kustomize edit — see .github/workflows/deploy.yml.
images:
  - name: graph-service-image
    newName: graph-service
    newTag: placeholder
