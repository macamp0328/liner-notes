apiVersion: apps/v1
kind: Deployment
metadata:
  name: graph-service
  namespace: liner-notes
  labels:
    app.kubernetes.io/name: graph-service
    app.kubernetes.io/part-of: liner-notes
spec:
  replicas: 1
  # The k3s node is a t3.micro — two pods will not fit. Recreate avoids the
  # rolling-update double-up; ~30s of downtime on redeploy is acceptable here.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: graph-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: graph-service
        app.kubernetes.io/part-of: liner-notes
    spec:
      # Token kept fresh by the ecr-pull-secret-refresher CronJob; bootstrapped
      # by the operator before first deploy — see infra/RUNBOOK.md.
      imagePullSecrets:
        - name: ecr-pull-secret
      # Defense-in-depth on a single-node k3s box where workload and control plane
      # share the host: the image already runs as the unprivileged node user
      # (USER 1000 in the Dockerfile); these settings make root a deploy-time error
      # rather than a silent regression.
      #
      # runAsUser MUST be numeric and accompany runAsNonRoot: the kubelet cannot
      # resolve a username (e.g. `USER node`) to a UID at admission, so with only
      # `runAsNonRoot: true` it fails the container with CreateContainerConfigError
      # ("image has non-numeric user (node), cannot verify user is non-root").
      # node:22-alpine's `node` user is uid/gid 1000 — pin it explicitly so the
      # kubelet can verify 1000 != 0.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: graph-service
          # `graph-service-image` is a logical name retargeted by the
          # `images:` block in kustomization.yaml — the operator runs
          # `kustomize edit set image graph-service-image=<ECR_URL>:<TAG>`
          # before `kubectl apply -k`. See infra/RUNBOOK.md.
          image: graph-service-image
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 3000
          # All runtime credentials (Aura URI/user/password, Discogs token, admin
          # token, optional Genius token) are populated by ExternalSecret from
          # AWS Secrets Manager — see external-secret.yaml.
          envFrom:
            - secretRef:
                name: graph-service-secrets
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: '3000'
            # Key the rate limiter on Cloudflare's cf-connecting-ip rather than the
            # direct peer (a CF edge / NodePort-SNAT IP shared by all traffic). Safe
            # ONLY because the origin SG is locked to Cloudflare ranges
            # (restrict_app_to_cloudflare), so the header can't be spoofed past the
            # edge. Forks NOT behind such a proxy must drop this — otherwise a direct
            # caller spoofs the header and bypasses the limiter. See #287.
            - name: TRUST_CF_CONNECTING_IP
              value: 'true'
            # Measured trial (#370): raise the reload scheduler's concurrency cap from
            # the code default 2 → 3 so the untagged `lyrics` stage overlaps the serial
            # Discogs ingest chain instead of waiting ~1h for a free slot. The third slot
            # covers the three lane families that can run in parallel (Discogs chain /
            # musicbrainz+track chain / untagged lyrics). NOTE: `nationality` holds the
            # `discogs` lane, so it still runs as the reload tail after the Discogs chain
            # finishes — concurrency alone won't move it earlier. Revert is a one-line
            # change here. See services/graph-service/CLAUDE.md → "Scheduling (#176)".
            - name: RELOAD_STAGE_CONCURRENCY
              value: '3'
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
