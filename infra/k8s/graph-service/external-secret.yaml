# Syncs AWS Secrets Manager → k8s Secret via External Secrets Operator.
#
# ESO authenticates to AWS by falling back to the default credential chain,
# which on EC2 lands on the instance profile (see infra/terraform/iam.tf).
# No access keys are committed or stored in the cluster.
#
# ESO must be installed in-cluster before this manifest is applied — see
# infra/RUNBOOK.md ("Install External Secrets Operator").

apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-prod
spec:
  provider:
    aws:
      service: SecretsManager
      # Must match var.aws_region in infra/terraform/variables.tf.
      region: us-east-1
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: graph-service-secrets
  namespace: liner-notes
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-prod
  target:
    name: graph-service-secrets
    creationPolicy: Owner
  dataFrom:
    # Pulls every JSON key from the secret into the k8s Secret. The secret in
    # AWS is populated by the operator (see runbook) with at minimum:
    #   NEO4J_URI, NEO4J_USER, NEO4J_PASSWORD,
    #   DISCOGS_USERNAME, DISCOGS_TOKEN, DISCOGS_USER_AGENT,
    #   ADMIN_TOKEN
    # Plus optional: GENIUS_TOKEN, ACOUSTICBRAINZ_USER_AGENT.
    - extract:
        key: liner-notes/graph-service/prod
