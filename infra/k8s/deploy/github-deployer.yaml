# Scoped CD identity for GitHub Actions.
#
# The CD workflow (issue #120) runs `kubectl apply -k infra/k8s/graph-service`
# + `kubectl -n liner-notes rollout status deployment/graph-service` against the
# private k3s API over an SSM port-forward. It must authenticate as THIS scoped
# ServiceAccount — never the cluster-admin /etc/rancher/k3s/k3s.yaml.
#
# This manifest is DELIBERATELY NOT part of infra/k8s/graph-service/kustomization.yaml:
# the deployer cannot create the identity it authenticates as, so the operator
# applies it once, out-of-band, with the admin kubeconfig. See infra/RUNBOOK.md
# "CD — cluster bootstrap". Keeping it out of that kustomization also means
# `kustomize build infra/k8s/graph-service` renders unchanged.
#
# The RBAC below is least-privilege, not cluster-admin: full apply verbs
# (get/list/watch/create/update/patch, NO delete — apply without --prune never
# deletes) on the kinds `kubectl apply -k` actually creates, and read-only
# (get/list/watch) on Pods/ReplicaSets/Jobs, which the Deployment/CronJob
# controllers create under their own service accounts and `rollout status` only
# reads.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-deployer
  namespace: liner-notes
---
# Long-lived (non-expiring) token for the SA. k8s >=1.24 no longer auto-mints a
# token Secret for a ServiceAccount, so we declare one explicitly. The token
# controller populates `.data.token` and `.data['ca.crt']` shortly after this is
# created (the minter polls for it). k3s persists it in etcd-on-EBS, so it
# survives instance stop/start.
apiVersion: v1
kind: Secret
metadata:
  name: github-deployer-token
  namespace: liner-notes
  annotations:
    kubernetes.io/service-account.name: github-deployer
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-deployer
  namespace: liner-notes
rules:
  # --- Kinds the kustomization creates/updates: full apply verbs. ---
  # core/v1 — Service (NodePort), ServiceAccount + Secret (ecr refresher /
  # ExternalSecret targets), ConfigMap (forward-looking). `secrets` write is
  # load-bearing twice over: it applies the graph-service-secrets / ecr-pull-secret
  # objects AND satisfies k8s' privilege-escalation rule when this SA creates the
  # ecr-pull-secret-refresher Role (which itself grants secrets get/create/update/
  # patch) and its RoleBinding — the actor must already hold a superset of the
  # granted perms. Because this Role's secret verbs are a superset, NO
  # `bind`/`escalate` verb is required.
  - apiGroups: ['']
    resources: ['services', 'serviceaccounts', 'configmaps', 'secrets']
    verbs: ['get', 'list', 'watch', 'create', 'update', 'patch']
  # apps/v1 — Deployment.
  - apiGroups: ['apps']
    resources: ['deployments']
    verbs: ['get', 'list', 'watch', 'create', 'update', 'patch']
  # batch/v1 — the ecr-pull-secret-refresher CronJob.
  - apiGroups: ['batch']
    resources: ['cronjobs']
    verbs: ['get', 'list', 'watch', 'create', 'update', 'patch']
  # rbac.authorization.k8s.io/v1 — the ecr-pull-secret-refresher Role +
  # RoleBinding (see the secrets-escalation note above).
  - apiGroups: ['rbac.authorization.k8s.io']
    resources: ['roles', 'rolebindings']
    verbs: ['get', 'list', 'watch', 'create', 'update', 'patch']
  # external-secrets.io — the namespaced ExternalSecret (graph-service-secrets).
  - apiGroups: ['external-secrets.io']
    resources: ['externalsecrets']
    verbs: ['get', 'list', 'watch', 'create', 'update', 'patch']
  # --- Kinds the controllers create, not the deployer: read-only. ---
  # Pods/ReplicaSets/Jobs are spawned by the Deployment/CronJob controllers under
  # their own service accounts. `rollout status` and debugging only read them, so
  # the deployer never needs create/update/patch here.
  - apiGroups: ['']
    resources: ['pods']
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['apps']
    resources: ['replicasets']
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['batch']
    resources: ['jobs']
    verbs: ['get', 'list', 'watch']
  # --- Post-deploy health gate (#270). ---
  # The gate asserts /api/v1/health on the rolled-out pod via
  # `kubectl port-forward deployment/graph-service` over the SSM-tunnelled API
  # server, instead of curling a (snapshot-prone) public SERVICE_URL. `create`
  # on the portforward subresource is the verb port-forward checks; the pod/
  # deployment reads it also needs are already granted above.
  - apiGroups: ['']
    resources: ['pods/portforward']
    verbs: ['create']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-deployer
  namespace: liner-notes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: github-deployer
subjects:
  - kind: ServiceAccount
    name: github-deployer
    namespace: liner-notes
---
# Sole cluster-scoped grant. external-secret.yaml defines a cluster-scoped
# ClusterSecretStore (aws-secrets-prod); every other object the kustomization
# applies is namespaced. No `namespaces` grant (the namespace pre-exists from the
# bootstrap) and no `customresourcedefinitions` grant (the external-secrets.io
# CRDs are installed by the ESO Helm chart, not by `apply -k`). This is one
# resource, not cluster-admin.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: github-deployer-clustersecretstores
rules:
  - apiGroups: ['external-secrets.io']
    resources: ['clustersecretstores']
    verbs: ['get', 'list', 'watch', 'create', 'update', 'patch']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: github-deployer-clustersecretstores
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: github-deployer-clustersecretstores
subjects:
  - kind: ServiceAccount
    name: github-deployer
    namespace: liner-notes
